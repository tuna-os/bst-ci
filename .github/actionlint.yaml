# Pre-existing, low-severity shellcheck findings in the disk-watcher
# background loop (unquoted $TARGETS is intentional word-splitting).
# Genuine quoting issues are fixed directly instead of ignored here.
#
# actionlint (<= 1.7.12) does not yet know the job.workflow_sha and
# job.workflow_ref contexts that GitHub documents for reusable workflows:
# https://docs.github.com/en/actions/reference/workflows-and-actions/contexts#job-context
# Remove that ignore once actionlint types them.
paths:
  .github/workflows/*.yml:
    ignore:
      - 'SC2086:'
      - 'property "workflow_(sha|ref)" is not defined in object type \{check_run_id'
